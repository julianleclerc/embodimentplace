name: Deploy to Cloudflare

# Deploys the Worker and its static files whenever they change on main.
# Content exports (content/**) do not trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "public/**"
      - "wrangler.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check wrangler.json against the live Worker
        run: node scripts/check-live-config.mjs
      - name: Deploy
        run: npx wrangler deploy
