name: Check live config

# Compares wrangler.json with the live Worker without deploying anything.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "worker/**"
      - "public/**"
      - "wrangler.json"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check wrangler.json against the live Worker
        run: node scripts/check-live-config.mjs
      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run
